map $http_upgrade $muse2api_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name muse.aicodeme.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name muse.aicodeme.xyz;
    ssl_certificate /etc/letsencrypt/live/muse.aicodeme.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muse.aicodeme.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 200m;
    access_log /var/log/nginx/muse2api-access.log;
    error_log /var/log/nginx/muse2api-error.log;

    # This installation updates through GitHub Actions and immutable images.
    location ~ ^/admin/(update/upgrade|repo/(pull|push))$ {
        default_type application/json;
        return 409 '{"detail":"Updates for this installation are managed by GitHub Actions: https://github.com/ccfwwm/muse2api/actions"}';
    }

    location / {
        proxy_pass http://127.0.0.1:18610;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $muse2api_connection_upgrade;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
    }
}
